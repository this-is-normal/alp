[package]
name = "p3-basefold"
description = "Basefold multilinear PCS over a foldable random linear code (ed25519-native, no FFT). M1: the foldable code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
p3-field.workspace = true
# The rayon/serial shim. Serial (no_std) by default; `parallel` flips it — and,
# via Cargo feature unification, the shared instance every other p3 crate sees.
p3-maybe-rayon.workspace = true
p3-util.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-matrix.workspace = true
p3-sumcheck.workspace = true
p3-multilinear-util.workspace = true

rand = { workspace = true }
rand_chacha = { version = "0.10", default-features = false }
serde = { workspace = true, features = ["derive", "alloc"] }
tracing.workspace = true

[features]
# COST ABLATION ONLY: `verify_core` returns Ok early, so a recursion guest's
# instruction count can be split by phase. Never enable in a real verifier.
ablate-after-sumcheck = []
ablate-after-merkle = []
# INSTRUMENTATION ONLY: records which foldable-code indices a verifier reads, so
# a recursion *host* can ship exactly those elements (or Merkle paths to them)
# instead of baking the whole table into the guest image. Needs `std` for the
# thread-local, so it is never on in a guest.
record-queries = []
# Rayon parallelism across the foldable-code encode, the fold rounds, and the
# per-round sumcheck reductions — BaseFold's whole prover.
parallel = ["p3-maybe-rayon/parallel"]

[dev-dependencies]
# Test-only: a no_std `Once` to hold a generated table behind a `fn` pointer.
spin = { workspace = true }
p3-ed25519 = { path = "../ed25519" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-symmetric = { path = "../symmetric" }

[lints]
workspace = true
