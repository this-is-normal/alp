[package]
name = "eddsa-example"
description = "End-to-end ed25519 signature-verification (EdDSA) STARK: the monolithic p3-ed25519-air EdDsaAir proved over the native ed25519 base field with the field-agnostic Brakedown tensor PCS on the multilinear multi-stark path."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
p3-air.workspace = true
# Optional: BabyBear Poseidon2 hash stack, enabled by the `bb-hash` feature.
p3-baby-bear = { path = "../baby-bear", optional = true }
rand_chacha = { version = "0.10", default-features = false }
p3-brakedown.workspace = true
p3-qa-code.workspace = true
p3-quasar.workspace = true
p3-basefold.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-ed25519.workspace = true
p3-ed25519-air.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-multi-stark.workspace = true
p3-stark-stats.workspace = true
p3-sumcheck.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true

num-bigint.workspace = true
p3-flat-serde.workspace = true
postcard = { workspace = true, features = ["alloc"] }
rand.workspace = true
tracing.workspace = true
tracing-forest = { workspace = true, features = ["ansi", "smallvec"] }
tracing-subscriber = { workspace = true, features = ["std", "env-filter"] }

[features]
# Rayon parallelism through multi-stark: parallelizes the zerocheck/opening
# sumchecks AND (via the shared maybe-rayon shim) the Brakedown Merkle commit.
# Rayon parallelism everywhere it exists. One shared `p3-maybe-rayon` instance
# backs every crate, so Cargo feature unification would flip most of these
# anyway — they are listed to declare the intent, and because `p3-basefold`'s
# is NOT reachable from `p3-multi-stark`.
parallel = [
    "p3-multi-stark/parallel",
    "p3-basefold/parallel",
    "p3-brakedown/parallel",
    "p3-qa-code/parallel",
    "p3-quasar/parallel",
    "p3-sumcheck/parallel",
]
# Swap the tensor PCS's code from Brakedown to Reed-Solomon (→ Ligero): high
# distance ⇒ few queries & smaller proofs, but superlinear Vandermonde encoding.
ligero = []
basefold = []
# Quasar: a quasi-abelian code commitment switched into BaseFold. Same polylog
# verifier as `basefold` with a much faster prover, at a somewhat larger proof.
quasar = []
# Swap the Merkle/Fiat-Shamir hash from Poseidon2-over-ed25519 to Poseidon2-over-BabyBear
# (SplitFieldHasher + DuplexChallengerCF). ~100x cheaper per permutation inside the 32-bit
# OpenVM verifier; the committed data, linear code, and sumcheck stay over ed25519. This is
# the recursion/guest operating point; the default keeps the pure-ed25519 hash for host comparison.
bb-hash = ["dep:p3-baby-bear"]
count-ops = ["p3-ed25519/count-ops", "p3-field/count-ops", "p3-merkle-tree/count-ops", "p3-quasar/count-ops"]
# INSTRUMENTATION: record which foldable-code indices a verifier reads, so a
# recursion host can ship exactly those (see `count_queries`). Host-only.
record-queries = ["p3-basefold/record-queries"]
# COST ABLATION ONLY (see p3-multi-stark).
ablate-zerocheck-only = ["p3-multi-stark/ablate-zerocheck-only"]
ablate-before-closing = ["p3-multi-stark/ablate-before-closing"]
ablate-after-sumcheck = ["p3-basefold/ablate-after-sumcheck"]
ablate-after-merkle = ["p3-basefold/ablate-after-merkle"]
# Quasar's own cut points, so `count_verify_bf` can attribute OPERATION COUNTS
# per phase instead of only over the whole verify. Without these the counters
# are global and cannot say whether an opening is field work or plumbing.
ablate-after-columns = ["p3-quasar/ablate-after-columns"]
ablate-after-encoding = ["p3-quasar/ablate-after-encoding"]
ablate-after-reduction = ["p3-quasar/ablate-after-reduction"]
ablate-after-online-opening = ["p3-quasar/ablate-after-online-opening"]
ablate-after-both-openings = ["p3-quasar/ablate-after-both-openings"]

[lints]
workspace = true
